[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/formulas",
    "crates/rules",
    "crates/progression",
    "crates/ranking",
    "crates/economy",
    "crates/simulation",
    "crates/core-engine",
    "crates/engine-service",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Proprietary"
authors = ["Universal Engagement Platform"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
